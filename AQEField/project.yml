# XcodeGen manifest — run `xcodegen generate` in this directory, then open AQEField.xcodeproj.
name: AQEField
options:
  bundleIdPrefix: com.aqe
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.5.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  AQEField:
    type: application
    platform: iOS
    sources:
      - path: AQEField
        excludes:
          - "Resources/**"
      - path: AQEField/Resources
        buildPhase: resources
    dependencies:
      - target: AQEFieldWidgets
        embed: true
    entitlements:
      path: AQEField/AQEField.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.aqe.field
    info:
      path: AQEField/Info.plist
      properties:
        CFBundleDisplayName: AQE Field
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSSupportsLiveActivities: true
        NSLocationWhenInUseUsageDescription: >-
          AQE Field tags every knock with GPS so your map, reports, and
          neighborhood stats stay accurate.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aqe.field
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UIUserInterfaceStyle: Light
  AQEFieldWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: AQEFieldWidgets
      # Shared with the app target:
      - path: AQEField/Models/Models.swift
      - path: AQEField/Models/FollowUpCadence.swift
      - path: AQEField/Models/ShiftActivity.swift
      - path: AQEField/Theme/AQETheme.swift
    entitlements:
      path: AQEFieldWidgets/AQEFieldWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.aqe.field
    info:
      path: AQEFieldWidgets/Info.plist
      properties:
        CFBundleDisplayName: AQE Field Widgets
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aqe.field.widgets
        TARGETED_DEVICE_FAMILY: "1"
