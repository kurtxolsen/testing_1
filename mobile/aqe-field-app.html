<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1B3A5C">
<title>AQE Field</title>
<style>
  :root {
    --bg:#F2F4F7; --card:#FFFFFF; --ink:#16273A; --muted:#5C6B7E;
    --navy:#1B3A5C; --navy-soft:#E7EDF4; --gold:#E8A020; --gold-ink:#8A5D0D;
    --line:#DCE2EA; --red:#B7362A; --red-soft:#F9E9E7; --green:#2E7D4F; --green-soft:#E7F2EB;
    --amber:#9A6A0F; --amber-soft:#FAF0DC;
    --sheet-shadow:0 -12px 40px rgba(22,39,58,.18);
  }
  @media (prefers-color-scheme: dark) { :root {
    --bg:#0D1622; --card:#16243A; --ink:#E8ECF2; --muted:#8FA0B5;
    --navy:#3E6EA5; --navy-soft:#1D3049; --gold:#F0AC36; --gold-ink:#F0AC36;
    --line:#25374F; --red:#E06050; --red-soft:#3A1F1D; --green:#58B380; --green-soft:#173226;
    --amber:#E3B45B; --amber-soft:#33290F;
    --sheet-shadow:0 -12px 40px rgba(0,0,0,.5);
  }}
  :root[data-theme="light"] {
    --bg:#F2F4F7; --card:#FFFFFF; --ink:#16273A; --muted:#5C6B7E;
    --navy:#1B3A5C; --navy-soft:#E7EDF4; --gold:#E8A020; --gold-ink:#8A5D0D;
    --line:#DCE2EA; --red:#B7362A; --red-soft:#F9E9E7; --green:#2E7D4F; --green-soft:#E7F2EB;
    --amber:#9A6A0F; --amber-soft:#FAF0DC;
    --sheet-shadow:0 -12px 40px rgba(22,39,58,.18);
  }
  :root[data-theme="dark"] {
    --bg:#0D1622; --card:#16243A; --ink:#E8ECF2; --muted:#8FA0B5;
    --navy:#3E6EA5; --navy-soft:#1D3049; --gold:#F0AC36; --gold-ink:#F0AC36;
    --line:#25374F; --red:#E06050; --red-soft:#3A1F1D; --green:#58B380; --green-soft:#173226;
    --amber:#E3B45B; --amber-soft:#33290F;
    --sheet-shadow:0 -12px 40px rgba(0,0,0,.5);
  }

  * { box-sizing:border-box; }
  html,body { margin:0; }
  body {
    background:var(--bg); color:var(--ink);
    font:16px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing:antialiased; padding-bottom:calc(76px + env(safe-area-inset-bottom));
  }
  button { font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer; }
  button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
    outline:2px solid var(--gold); outline-offset:2px;
  }
  input, select, textarea {
    font:inherit; color:var(--ink); background:var(--card);
    border:1px solid var(--line); border-radius:10px; padding:10px 12px; width:100%;
  }
  a { color:var(--navy); }

  /* ---- header ---- */
  header {
    position:sticky; top:0; z-index:20; background:var(--navy);
    padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
    display:flex; align-items:center; justify-content:space-between;
  }
  :root[data-theme="dark"] header, :root:not([data-theme="light"]) header { }
  header .brand { color:#fff; font-weight:700; letter-spacing:.04em; font-size:15px; }
  header .brand small { display:block; font-weight:400; letter-spacing:.14em; font-size:9px;
    color:var(--gold); text-transform:uppercase; }
  header .h-actions { display:flex; gap:14px; }
  header .h-actions button { color:#fff; opacity:.85; font-size:13px; }

  main { padding:14px 14px 0; max-width:640px; margin:0 auto; }
  .view { display:none; }
  .view.active { display:block; }

  .eyebrow { font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted);
    font-weight:600; margin:18px 2px 8px; }
  .eyebrow:first-child { margin-top:2px; }

  /* ---- pipeline strip ---- */
  .pipe { display:flex; gap:6px; overflow-x:auto; padding:2px 2px 10px; -webkit-overflow-scrolling:touch; }
  .pipe button { flex:0 0 auto; background:var(--card); border:1px solid var(--line);
    border-radius:999px; padding:5px 11px; font-size:12.5px; color:var(--muted); white-space:nowrap; }
  .pipe button b { color:var(--ink); font-variant-numeric:tabular-nums; }
  .pipe button.on { background:var(--navy); border-color:var(--navy); color:#fff; }
  .pipe button.on b { color:var(--gold); }

  /* ---- cards ---- */
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px;
    padding:13px 14px; margin-bottom:10px; position:relative; }
  .lead-card { padding-left:18px; width:100%; text-align:left; display:block; }
  .lead-card::before { content:""; position:absolute; left:0; top:10px; bottom:10px; width:4px;
    border-radius:0 4px 4px 0; background:var(--stripe, var(--line)); }
  .lead-top { display:flex; justify-content:space-between; gap:10px; align-items:baseline; }
  .lead-name { font-weight:650; font-size:16.5px; }
  .lead-val { color:var(--muted); font-size:13px; font-variant-numeric:tabular-nums; }
  .lead-sub { color:var(--muted); font-size:13.5px; margin-top:2px; }
  .badges { display:flex; flex-wrap:wrap; gap:6px; margin-top:9px; }
  .chip { font-size:11.5px; font-weight:600; letter-spacing:.02em; border-radius:999px; padding:3px 9px; }
  .chip.status { background:var(--navy-soft); color:var(--navy); }
  .chip.ok { background:var(--green-soft); color:var(--green); }
  .chip.warn { background:var(--amber-soft); color:var(--amber); }
  .chip.late { background:var(--red-soft); color:var(--red); }

  .empty { text-align:center; color:var(--muted); padding:44px 24px; font-size:14.5px; }
  .empty b { display:block; font-size:17px; color:var(--ink); margin-bottom:6px; }

  /* ---- search ---- */
  .searchrow { display:flex; gap:8px; margin-bottom:12px; }
  .searchrow input { flex:1; }
  .btn { background:var(--navy); color:#fff; border-radius:10px; padding:10px 16px; font-weight:600; }
  .btn.gold { background:var(--gold); color:#20293A; }
  .btn.ghost { background:var(--card); color:var(--ink); border:1px solid var(--line); }
  .btn.danger { background:var(--red-soft); color:var(--red); }
  .btn:disabled { opacity:.5; }

  /* ---- objections ---- */
  .cats { display:flex; gap:6px; overflow-x:auto; padding-bottom:10px; -webkit-overflow-scrolling:touch; }
  .cats button { flex:0 0 auto; background:var(--card); border:1px solid var(--line);
    border-radius:999px; padding:5px 11px; font-size:12.5px; color:var(--muted); white-space:nowrap; }
  .cats button.on { background:var(--gold); border-color:var(--gold); color:#20293A; font-weight:650; }
  .obj-q { font-weight:650; font-size:15.5px; }
  .obj-cat { color:var(--muted); font-size:12px; margin-top:2px; }
  .obj-body { display:none; margin-top:10px; border-top:1px solid var(--line); padding-top:10px; }
  .obj-open .obj-body { display:block; }
  .obj-sec { font-size:11px; letter-spacing:.1em; text-transform:uppercase; font-weight:700; margin:10px 0 3px; }
  .obj-sec.rf { color:var(--navy); } .obj-sec.rs { color:var(--gold-ink); } .obj-sec.ps { color:var(--muted); }
  .obj-body p { margin:0 0 4px; font-size:14.5px; }
  .obj-body p.say { background:var(--navy-soft); border-radius:10px; padding:10px 12px; }

  /* ---- intel ---- */
  .intel-cols h4 { margin:12px 0 4px; font-size:12px; letter-spacing:.08em; text-transform:uppercase; }
  .intel-cols h4.pb { color:var(--red); } .intel-cols h4.cs { color:var(--green); }
  .intel-cols ul { margin:0; padding-left:18px; font-size:14px; }
  .intel-cols li { margin-bottom:5px; }

  /* ---- sheet / modal ---- */
  .sheet-wrap { position:fixed; inset:0; z-index:40; display:none; }
  .sheet-wrap.open { display:block; }
  .scrim { position:absolute; inset:0; background:rgba(10,18,28,.45); }
  .sheet { position:absolute; left:0; right:0; bottom:0; max-height:88%; overflow-y:auto;
    background:var(--bg); border-radius:18px 18px 0 0; box-shadow:var(--sheet-shadow);
    padding:10px 16px calc(20px + env(safe-area-inset-bottom)); }
  .sheet .grab { width:38px; height:4px; border-radius:2px; background:var(--line); margin:2px auto 12px; }
  .sheet h2 { margin:0 0 12px; font-size:19px; }
  .frow { margin-bottom:10px; }
  .frow label { display:block; font-size:12px; font-weight:600; color:var(--muted); margin-bottom:4px;
    letter-spacing:.04em; text-transform:uppercase; }
  .frow2 { display:flex; gap:10px; } .frow2 .frow { flex:1; }
  .sheet .actions { display:flex; gap:10px; margin-top:14px; }
  .sheet .actions .btn { flex:1; text-align:center; }

  .detail-links { display:flex; gap:8px; margin:10px 0; }
  .detail-links a { flex:1; text-align:center; background:var(--card); border:1px solid var(--line);
    border-radius:10px; padding:9px 4px; font-size:13.5px; text-decoration:none; font-weight:600; }
  .touchlog { font-size:13.5px; }
  .touchlog li { margin-bottom:6px; }
  .touchlog .t-when { color:var(--muted); font-size:12px; }

  /* ---- quiz ---- */
  .quiz-card { text-align:center; padding:26px 18px; }
  .quiz-card .q { font-size:19px; font-weight:650; text-wrap:balance; margin:8px 0 18px; }

  /* ---- tab bar ---- */
  nav.tabbar { position:fixed; left:0; right:0; bottom:0; z-index:30;
    background:var(--card); border-top:1px solid var(--line);
    display:flex; padding:6px 8px calc(6px + env(safe-area-inset-bottom)); }
  nav.tabbar button { flex:1; display:flex; flex-direction:column; align-items:center; gap:2px;
    color:var(--muted); font-size:10.5px; font-weight:600; letter-spacing:.02em; padding:4px 0;
    position:relative; }
  nav.tabbar button.on { color:var(--navy); }
  nav.tabbar svg { width:23px; height:23px; }
  nav.tabbar .nbadge { position:absolute; top:-1px; right:calc(50% - 21px);
    background:var(--red); color:#fff; border-radius:999px; font-size:10px; min-width:16px;
    height:16px; line-height:16px; padding:0 4px; font-variant-numeric:tabular-nums; }

  .fab { position:fixed; right:18px; bottom:calc(86px + env(safe-area-inset-bottom)); z-index:25;
    width:54px; height:54px; border-radius:50%; background:var(--gold); color:#20293A;
    font-size:30px; line-height:54px; text-align:center; box-shadow:0 6px 18px rgba(0,0,0,.25); }

  .toast { position:fixed; left:50%; transform:translateX(-50%);
    bottom:calc(96px + env(safe-area-inset-bottom)); z-index:50; background:var(--ink); color:var(--bg);
    padding:9px 16px; border-radius:999px; font-size:13.5px; opacity:0; transition:opacity .2s; pointer-events:none; }
  .toast.show { opacity:1; }
  @media (prefers-reduced-motion: reduce) { .toast { transition:none; } }
</style>

<header>
  <div class="brand">AMERICAN QUALITY EXTERIORS<small>Field Toolkit</small></div>
  <div class="h-actions">
    <button id="btn-export" aria-label="Backup data">Backup</button>
    <button id="btn-import" aria-label="Restore data">Restore</button>
  </div>
</header>

<main>
  <!-- LEADS -->
  <section class="view active" id="view-leads">
    <div class="pipe" id="pipe"></div>
    <div class="searchrow"><input id="lead-search" type="search" placeholder="Search name, address, carrier"></div>
    <div id="lead-list"></div>
  </section>

  <!-- FOLLOW-UPS -->
  <section class="view" id="view-followups">
    <div class="eyebrow">Breaching staleness thresholds</div>
    <div id="fu-list"></div>
  </section>

  <!-- OBJECTIONS -->
  <section class="view" id="view-obj">
    <div class="searchrow">
      <input id="obj-search" type="search" placeholder='Try "deductible" or "storm chaser"'>
      <button class="btn gold" id="btn-quiz">Quiz</button>
    </div>
    <div class="cats" id="obj-cats"></div>
    <div id="obj-list"></div>
  </section>

  <!-- INTEL -->
  <section class="view" id="view-intel">
    <div class="eyebrow">Carrier field intelligence</div>
    <div id="intel-list"></div>
  </section>
</main>

<button class="fab" id="fab" aria-label="Add lead">+</button>

<nav class="tabbar">
  <button data-tab="leads" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20V9.5L12 4l8 5.5V20h-5v-6h-6v6H4z"/></svg>Leads</button>
  <button data-tab="followups"><span class="nbadge" id="fu-badge" hidden></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3.5 2"/></svg>Follow-ups</button>
  <button data-tab="obj"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 5h16v11H9l-5 4V5z"/></svg>Objections</button>
  <button data-tab="intel"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3l8 4-8 4-8-4 8-4zM4 11l8 4 8-4M4 15l8 4 8-4"/></svg>Intel</button>
</nav>

<!-- add/edit lead sheet -->
<div class="sheet-wrap" id="sheet-add">
  <div class="scrim" data-close></div>
  <div class="sheet">
    <div class="grab"></div>
    <h2 id="add-title">New lead</h2>
    <div class="frow"><label for="f-name">Name *</label><input id="f-name" autocomplete="off"></div>
    <div class="frow"><label for="f-address">Address</label><input id="f-address" autocomplete="off"></div>
    <div class="frow2">
      <div class="frow"><label for="f-phone">Phone</label><input id="f-phone" inputmode="tel"></div>
      <div class="frow"><label for="f-value">Est. value $</label><input id="f-value" inputmode="numeric"></div>
    </div>
    <div class="frow2">
      <div class="frow"><label for="f-carrier">Carrier</label><input id="f-carrier"></div>
      <div class="frow"><label for="f-source">Source</label>
        <select id="f-source"><option>knock</option><option>referral</option><option>sign-call</option><option>canvass</option></select></div>
    </div>
    <div class="frow"><label for="f-notes">Notes</label><textarea id="f-notes" rows="2"></textarea></div>
    <div class="actions">
      <button class="btn ghost" data-close>Cancel</button>
      <button class="btn" id="btn-save-lead">Save lead</button>
    </div>
  </div>
</div>

<!-- lead detail sheet -->
<div class="sheet-wrap" id="sheet-detail">
  <div class="scrim" data-close></div>
  <div class="sheet" id="detail-body"></div>
</div>

<!-- quiz sheet -->
<div class="sheet-wrap" id="sheet-quiz">
  <div class="scrim" data-close></div>
  <div class="sheet">
    <div class="grab"></div>
    <div class="quiz-card" id="quiz-body"></div>
  </div>
</div>

<div class="toast" id="toast" role="status"></div>
<input type="file" id="import-file" accept="application/json" hidden>

<script>
"use strict";

/* ================= pipeline model (mirrors stormtrack) ================= */
const PIPELINE = ["knocked","inspected","claim-filed","adjuster-scheduled","adjuster-met",
                  "approved","contract-signed","build-scheduled","built","closed"];
const TERMINAL = ["dead","denied"];
const THRESHOLDS = { "knocked":2,"inspected":1,"claim-filed":3,"adjuster-scheduled":0,
  "adjuster-met":1,"approved":1,"contract-signed":5,"build-scheduled":7 };
const TOUCH_TYPES = ["call","text","door","email","adjuster-meeting","note"];

/* ================= storage ================= */
const KEY = "aqe-field-v1";
let db = { leads: [], intelNotes: {} , seq: 1 };
try { const raw = localStorage.getItem(KEY); if (raw) db = Object.assign(db, JSON.parse(raw)); } catch (e) {}
function save() { try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) { toast("Couldn't save — storage full?"); } }

/* ================= helpers ================= */
const $ = (s, el=document) => el.querySelector(s);
const $$ = (s, el=document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money = v => v ? "$" + Number(v).toLocaleString() : "";
const daysSince = ts => Math.floor((Date.now() - ts) / 86400000);
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 2200); }

function staleness(lead) {
  if (!(lead.status in THRESHOLDS)) return null;
  const th = THRESHOLDS[lead.status], d = daysSince(lead.lastTouch);
  const isToday = new Date(lead.lastTouch).toDateString() === new Date().toDateString();
  if (th === 0) return isToday ? { level:"ok", d } : { level: d >= 2 ? "late" : "warn", d, over: d };
  if (d <= th) return { level:"ok", d };
  return { level: d >= 2*th ? "late" : "warn", d, over: d - th };
}

/* ================= leads view ================= */
let pipeFilter = null;
function renderPipe() {
  const counts = {}; db.leads.forEach(l => counts[l.status] = (counts[l.status]||0)+1);
  $("#pipe").innerHTML = [["All", null, db.leads.length],
      ...PIPELINE.concat(TERMINAL).map(s => [s, s, counts[s]||0])]
    .filter(([,, n], i) => i === 0 || n > 0)
    .map(([label, val, n]) => `<button data-pf="${val ?? ""}" class="${pipeFilter===val?"on":""}">${label} <b>${n}</b></button>`)
    .join("");
}
function stripeFor(lead) {
  const s = staleness(lead);
  if (lead.status === "dead") return "var(--line)";
  if (lead.status === "denied") return "var(--red)";
  if (!s || s.level === "ok") return "var(--green)";
  return s.level === "late" ? "var(--red)" : "var(--amber)";
}
function leadCard(lead) {
  const s = staleness(lead);
  let stale = "";
  if (s && s.level !== "ok") stale = `<span class="chip ${s.level}">${s.d}d stale</span>`;
  return `<button class="card lead-card" data-lead="${lead.id}" style="--stripe:${stripeFor(lead)}">
    <div class="lead-top"><span class="lead-name">${esc(lead.name)}</span>
      <span class="lead-val">${money(lead.value)}</span></div>
    ${lead.address ? `<div class="lead-sub">${esc(lead.address)}</div>` : ""}
    <div class="badges"><span class="chip status">${lead.status}</span>${stale}
      ${lead.carrier ? `<span class="chip status">${esc(lead.carrier)}</span>` : ""}</div>
  </button>`;
}
function renderLeads() {
  renderPipe();
  const q = $("#lead-search").value.trim().toLowerCase();
  let list = db.leads.slice().sort((a,b) => b.lastTouch - a.lastTouch);
  if (pipeFilter) list = list.filter(l => l.status === pipeFilter);
  if (q) list = list.filter(l => (l.name+" "+(l.address||"")+" "+(l.carrier||"")).toLowerCase().includes(q));
  $("#lead-list").innerHTML = list.length ? list.map(leadCard).join("")
    : `<div class="empty"><b>${db.leads.length ? "No matches" : "No leads yet"}</b>
       ${db.leads.length ? "Try a different search or filter." : "Tap + after your next knock."}</div>`;
}

/* ================= follow-ups ================= */
function renderFollowups() {
  const due = db.leads.map(l => ({ l, s: staleness(l) }))
    .filter(x => x.s && x.s.level !== "ok")
    .sort((a,b) => (b.s.over||0) - (a.s.over||0));
  $("#fu-badge").hidden = !due.length;
  $("#fu-badge").textContent = due.length;
  $("#fu-list").innerHTML = due.length ? due.map(({l, s}) =>
    `<button class="card lead-card" data-lead="${l.id}" style="--stripe:${s.level==="late"?"var(--red)":"var(--amber)"}">
       <div class="lead-top"><span class="lead-name">${esc(l.name)}</span>
         <span class="chip ${s.level}">+${s.over}d overdue</span></div>
       <div class="lead-sub">${l.status} · last touch ${s.d}d ago${l.phone ? " · " + esc(l.phone) : ""}</div>
     </button>`).join("")
    : `<div class="empty"><b>Nothing overdue</b>Go knock.</div>`;
}

/* ================= lead detail ================= */
let detailId = null;
function openDetail(id) {
  detailId = id;
  const l = db.leads.find(x => x.id === id); if (!l) return;
  const idx = PIPELINE.indexOf(l.status);
  const next = idx >= 0 && idx < PIPELINE.length - 1 ? PIPELINE[idx+1] : null;
  const mapsUrl = "https://maps.apple.com/?q=" + encodeURIComponent(l.address || "");
  $("#detail-body").innerHTML = `
    <div class="grab"></div>
    <h2>${esc(l.name)}</h2>
    ${l.address ? `<div class="lead-sub">${esc(l.address)}</div>` : ""}
    <div class="badges" style="margin:8px 0 2px">
      <span class="chip status">${l.status}</span>
      ${l.carrier ? `<span class="chip status">${esc(l.carrier)}</span>` : ""}
      ${l.value ? `<span class="chip ok">${money(l.value)}</span>` : ""}
      <span class="chip ${ (staleness(l)||{level:"ok"}).level==="ok" ? "ok" : (staleness(l).level) }">
        touched ${daysSince(l.lastTouch)}d ago</span>
    </div>
    <div class="detail-links">
      ${l.phone ? `<a href="tel:${esc(l.phone)}">Call</a><a href="sms:${esc(l.phone)}">Text</a>` : ""}
      ${l.address ? `<a href="${mapsUrl}" target="_blank" rel="noopener">Map</a>` : ""}
    </div>
    ${l.notes ? `<div class="card" style="font-size:14px">${esc(l.notes)}</div>` : ""}

    <div class="eyebrow">Move status</div>
    <div class="frow2">
      ${next ? `<button class="btn" id="d-advance">→ ${next}</button>` : ""}
      <select id="d-status" style="flex:1">${PIPELINE.concat(TERMINAL)
        .map(s => `<option ${s===l.status?"selected":""}>${s}</option>`).join("")}</select>
    </div>

    <div class="eyebrow">Log a touch</div>
    <div class="frow2">
      <select id="d-ttype">${TOUCH_TYPES.map(t=>`<option>${t}</option>`).join("")}</select>
      <input id="d-tnote" placeholder="note (optional)">
    </div>
    <div class="actions"><button class="btn gold" id="d-touch">Log touch</button></div>

    ${l.touches.length ? `<div class="eyebrow">History</div>
      <ul class="touchlog">${l.touches.slice().reverse().slice(0, 20).map(t =>
        `<li><b>${t.type}</b>${t.note ? " — " + esc(t.note) : ""}<div class="t-when">${new Date(t.at).toLocaleString()}</div></li>`).join("")}</ul>` : ""}

    <div class="actions">
      <button class="btn ghost" data-close>Close</button>
      <button class="btn danger" id="d-delete">Delete</button>
    </div>`;
  $("#sheet-detail").classList.add("open");

  const setStatus = (ns) => {
    if (ns === l.status) return;
    if (ns === "dead") { const r = prompt("Reason it's dead?"); if (r === null) { renderAll(); openDetail(id); return; } l.deadReason = r; }
    l.touches.push({ type:"status", note:`${l.status} → ${ns}`, at:Date.now() });
    l.status = ns; l.lastTouch = Date.now(); save(); renderAll(); openDetail(id);
  };
  if (next) $("#d-advance").onclick = () => setStatus(next);
  $("#d-status").onchange = e => setStatus(e.target.value);
  $("#d-touch").onclick = () => {
    l.touches.push({ type:$("#d-ttype").value, note:$("#d-tnote").value.trim(), at:Date.now() });
    l.lastTouch = Date.now(); save(); renderAll(); toast("Touch logged"); openDetail(id);
  };
  $("#d-delete").onclick = () => {
    if (!confirm(`Delete ${l.name}? This can't be undone.`)) return;
    db.leads = db.leads.filter(x => x.id !== id); save(); closeSheets(); renderAll(); toast("Lead deleted");
  };
}

let objCat = null;
function objScore(query, o) {
  const q = query.toLowerCase().trim(); if (!q) return 1;
  const hay = (o.q + " " + o.t).toLowerCase(), body = (o.rf + " " + o.rs + " " + o.ps).toLowerCase();
  let s = 0;
  for (const w of q.split(/\s+/)) {
    if (hay.includes(w)) { s += 3; continue; }
    // typo tolerance: match on 4-char prefixes ("deductable" hits "deductible")
    if (w.length >= 4 && new RegExp("\\b" + w.slice(0, 4)).test(hay)) { s += 2; continue; }
    if (body.includes(w)) s += 1;
  }
  return s;
}
function renderObjCats() {
  const cats = [...new Set(OBJECTIONS.map(o => o.c))];
  $("#obj-cats").innerHTML = [`<button data-cat="" class="${objCat?"":"on"}">All</button>`,
    ...cats.map(c => `<button data-cat="${esc(c)}" class="${objCat===c?"on":""}">${esc(c)}</button>`)].join("");
}
function renderObjections() {
  renderObjCats();
  const q = $("#obj-search").value;
  let list = OBJECTIONS.map((o, i) => ({ o, i, s: objScore(q, o) })).filter(x => x.s > 0);
  if (objCat) list = list.filter(x => x.o.c === objCat);
  if (q.trim()) list.sort((a,b) => b.s - a.s);
  $("#obj-list").innerHTML = list.length ? list.map(({o, i}) =>
    `<div class="card obj-card" data-obj="${i}">
       <button style="display:block;width:100%;text-align:left">
         <div class="obj-q">&ldquo;${esc(o.q)}&rdquo;</div>
         <div class="obj-cat">${esc(o.c)}</div>
       </button>
       <div class="obj-body">
         <div class="obj-sec rf">The reframe</div><p>${esc(o.rf)}</p>
         <div class="obj-sec rs">Say this</div><p class="say">&ldquo;${esc(o.rs)}&rdquo;</p>
         <div class="obj-sec ps">Why it works</div><p>${esc(o.ps)}</p>
       </div>
     </div>`).join("")
    : `<div class="empty"><b>No match</b>Try fewer words.</div>`;
}

    <div class="q">&ldquo;${esc(o.q)}&rdquo;</div>
    <button class="btn gold" id="quiz-reveal">Reveal the response</button>
    <div id="quiz-answer" hidden style="text-align:left;margin-top:16px">
      <div class="obj-sec rs" style="color:var(--gold-ink)">Say this</div>
      <p class="say" style="background:var(--navy-soft);border-radius:10px;padding:10px 12px;font-size:14.5px">&ldquo;${esc(o.rs)}&rdquo;</p>
      <div class="obj-sec ps" style="color:var(--muted)">Why it works</div>
      <p style="font-size:14px">${esc(o.ps)}</p>
    </div>
    <div class="actions" style="display:flex;gap:10px;margin-top:16px">
      <button class="btn ghost" data-close style="flex:1">Done</button>
      <button class="btn" id="quiz-next" style="flex:1">Next one</button>
    </div>`;
  $("#sheet-quiz").classList.add("open");
  $("#quiz-reveal").onclick = e => { $("#quiz-answer").hidden = false; e.target.hidden = true; };
  $("#quiz-next").onclick = openQuiz;
}

/* ================= intel ================= */
function renderIntel() {
  $("#intel-list").innerHTML = CARRIERS.map(([name, pb, cs], i) => {
    const notes = db.intelNotes[name] || [];
    return `<div class="card">
      <div class="lead-name">${esc(name)}</div>
      <div class="intel-cols">
        <h4 class="pb">Their likely pushback</h4><ul>${pb.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>
        <h4 class="cs">My counters</h4><ul>${cs.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>
        ${notes.length ? `<h4 style="color:var(--gold-ink)">My field notes</h4><ul>${notes.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>` : ""}
      </div>
      <div class="actions" style="display:flex;margin-top:12px">
        <button class="btn ghost" data-learn="${esc(name)}" style="flex:1">+ Add field note</button>
      </div>
    </div>`;
  }).join("");
}

/* ================= backup / restore ================= */
function exportData() {
  const blob = new Blob([JSON.stringify(db, null, 2)], { type:"application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "aqe-field-backup-" + new Date().toISOString().slice(0,10) + ".json";
  a.click(); URL.revokeObjectURL(a.href);
  toast("Backup downloaded");
}
function importData(file) {
  const r = new FileReader();
  r.onload = () => {
    try {
      const data = JSON.parse(r.result);
      if (!Array.isArray(data.leads)) throw new Error("bad file");
      if (!confirm(`Replace current data with backup (${data.leads.length} leads)?`)) return;
      db = Object.assign({ leads:[], intelNotes:{}, seq:1 }, data);
      save(); renderAll(); toast("Backup restored");
    } catch (e) { toast("That file isn't an AQE backup"); }
  };
  r.readAsText(file);
}

/* ================= wiring ================= */
function closeSheets() { $$(".sheet-wrap").forEach(s => s.classList.remove("open")); }
function renderAll() { renderLeads(); renderFollowups(); renderIntel(); }

document.addEventListener("click", e => {
  const t = e.target.closest("[data-tab],[data-close],[data-lead],[data-pf],[data-cat],[data-learn],.obj-card button");
  if (!t) return;
  if (t.dataset.tab !== undefined) {
    $$(".tabbar button").forEach(b => b.classList.toggle("on", b === t));
    $$(".view").forEach(v => v.classList.toggle("active", v.id === "view-" + t.dataset.tab));
    $("#fab").style.display = t.dataset.tab === "leads" ? "" : "none";
    return;
  }
  if (t.dataset.close !== undefined) { closeSheets(); return; }
  if (t.dataset.lead) { openDetail(Number(t.dataset.lead)); return; }
  if (t.dataset.pf !== undefined) { pipeFilter = t.dataset.pf || null; renderLeads(); return; }
  if (t.dataset.cat !== undefined) { objCat = t.dataset.cat || null; renderObjections(); return; }
  if (t.dataset.learn) {
    const note = prompt(`New field note for ${t.dataset.learn}:`);
    if (note && note.trim()) {
      (db.intelNotes[t.dataset.learn] = db.intelNotes[t.dataset.learn] || []).push(note.trim());
      save(); renderIntel(); toast("Noted — it compounds");
    }
    return;
  }
  const objCard = t.closest(".obj-card");
  if (objCard) objCard.classList.toggle("obj-open");
});

$("#fab").onclick = () => { $$("#sheet-add input, #sheet-add textarea").forEach(i => i.value = "");
  $("#sheet-add").classList.add("open"); setTimeout(() => $("#f-name").focus(), 60); };
$("#btn-save-lead").onclick = () => {
  const name = $("#f-name").value.trim();
  if (!name) { toast("Name is required"); return; }
  const norm = s => s.toLowerCase().replace(/\s+/g, " ");
  const dupe = db.leads.find(l => norm(l.name) === norm(name) &&
    norm(l.address||"") === norm($("#f-address").value.trim()));
  if (dupe && !confirm(`Looks like a duplicate of ${dupe.name}. Add anyway?`)) return;
  db.leads.push({
    id: db.seq++, name,
    address: $("#f-address").value.trim(), phone: $("#f-phone").value.trim(),
    carrier: $("#f-carrier").value.trim(), source: $("#f-source").value,
    value: Number($("#f-value").value) || null, notes: $("#f-notes").value.trim(),
    status: "knocked", created: Date.now(), lastTouch: Date.now(),
    touches: [{ type:"door", note:"initial knock", at:Date.now() }],
  });
  save(); closeSheets(); renderAll(); toast("Lead saved — status: knocked");
};

$("#lead-search").addEventListener("input", renderLeads);
$("#obj-search").addEventListener("input", renderObjections);
$("#btn-quiz").onclick = openQuiz;
$("#btn-export").onclick = exportData;
$("#btn-import").onclick = () => $("#import-file").click();
$("#import-file").onchange = e => { if (e.target.files[0]) importData(e.target.files[0]); e.target.value = ""; };

renderAll(); renderObjections();
</script>
